---
name: sse-rooms-redis

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/sse-rooms-redis/**'
      - 'lib/sse/rooms/**'
  push:
    branches:
      - main
    paths:
      - 'packages/sse-rooms-redis/**'
      - 'lib/sse/rooms/**'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/sse-rooms-redis

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # turbo builds the root package these tasks resolve through.
      - name: Run Tests
        run: pnpm exec turbo run test

      - name: Run Linting
        run: pnpm exec turbo run lint
