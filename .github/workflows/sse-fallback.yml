---
name: sse-fallback

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/sse-fallback/**'
      # It parses the wire format with this package.
      - 'packages/sse-parser/**'
  push:
    branches:
      - main
    paths:
      - 'packages/sse-fallback/**'
      # It parses the wire format with this package.
      - 'packages/sse-parser/**'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/sse-fallback

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # The README promises this package is browser-safe. The root test suite
      # asserts it too, but that suite does not run in this workflow, so make
      # the guarantee explicit here as well: no server-only import may reach
      # the published sources.
      - name: Check browser safety of the source tree
        run: |
          if grep -rnE "from '(node:|fastify|awilix)|require\(" src --include='*.ts' \
            --exclude='*.spec.ts'; then
            echo "::error::server-only import found in a browser-safe package"
            exit 1
          fi

      # turbo builds the workspace dependencies these tasks resolve through.
      - name: Run Tests
        run: pnpm exec turbo run test

      - name: Run Linting
        run: pnpm exec turbo run lint

      - name: Build
        run: pnpm exec turbo run build
