---
name: gateway-acceptance

# Acceptance tests boot real Envoy and KrakenD containers via docker compose,
# render configs from each package's renderer, and drive traffic through the
# gateway against a Node stub upstream. We only run them when gateway code
# changes — they're slower than the unit suite and would be wasteful on
# unrelated PRs.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/gateway/**'
      - 'packages/gateway-envoy/**'
      - 'packages/gateway-krakend/**'
      - 'packages/gateway-kong/**'
      - '.github/workflows/gateway-acceptance.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/gateway/**'
      - 'packages/gateway-envoy/**'
      - 'packages/gateway-krakend/**'
      - 'packages/gateway-kong/**'
      - '.github/workflows/gateway-acceptance.yml'

permissions: {}

jobs:
  envoy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/gateway-envoy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      # turbo builds the root package these tasks resolve through.
      - name: Run unit tests
        run: pnpm exec turbo run test
      - name: Run acceptance tests (docker compose)
        run: pnpm exec turbo run test:acceptance

  krakend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/gateway-krakend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      # turbo builds the root package these tasks resolve through.
      - name: Run unit tests
        run: pnpm exec turbo run test
      - name: Run acceptance tests (docker compose)
        run: pnpm exec turbo run test:acceptance

  kong:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/gateway-kong
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      # turbo builds the root package these tasks resolve through.
      - name: Run unit tests
        run: pnpm exec turbo run test
      - name: Run acceptance tests (docker compose)
        run: pnpm exec turbo run test:acceptance
